<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复现进度与云端同步</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:"Microsoft YaHei",Arial,sans-serif}header{background:#10213c;color:white;padding:23px max(5%,calc((100% - 1100px)/2))}header h1{margin:0 0 7px;font-size:23px}header p{margin:0;color:#cbd5e1;font-size:13px;line-height:1.7}nav{background:#fff;padding:12px max(5%,calc((100% - 1100px)/2));display:flex;gap:15px;flex-wrap:wrap;border-bottom:1px solid #e2e8f0}a{color:#2563eb;text-decoration:none}main{max-width:1100px;margin:22px auto;padding:0 15px}.panel,.record{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:13px}h2{font-size:18px;margin:0 0 10px}.muted{font-size:13px;color:#64748b;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:11px}.stat strong{display:block;font-size:21px;color:#2563eb}.stat span{font-size:12px;color:#64748b}input,select,textarea{font:inherit;border:1px solid #e2e8f0;border-radius:8px;padding:10px;max-width:100%}button{border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;background:#fff;cursor:pointer}button.primary{background:#2563eb;color:#fff}.formrow{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.formrow input{flex:1;min-width:170px}.statusline{font-size:13px;padding:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-top:8px}.record h3{font-size:16px;margin:0 0 5px}.meta{font-size:12px;color:#64748b}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:9px 0}.bar{height:8px;background:#e8eef7;border-radius:20px;overflow:hidden;flex:1;min-width:100px}.bar span{display:block;height:100%;background:#2563eb}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.check{display:flex;gap:6px;align-items:flex-start;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:12px}textarea{width:100%;min-height:58px;resize:vertical}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.checks{grid-template-columns:1fr 1fr}}@media(max-width:450px){.checks{grid-template-columns:1fr}}
</style></head><body><header><h1>🧪 复现进度与云端同步</h1><p>本地自动保存；配置 Supabase 并登录后，可在多台设备同步任务、阶段和实验记录。</p></header><nav><a href="../index.html">科研首页</a><a href="../papers/index.html">论文库</a><a href="../datasets/index.html">数据集</a><a href="../papers/pdf.html?id=attentionoffsetnet">PDF 阅读器</a></nav><main>
<section class="panel" id="cloud"><h2>云端数据库连接</h2><p class="muted">先创建 Supabase 项目，在 SQL Editor 执行仓库 <a href="../supabase/schema.sql">supabase/schema.sql</a>，再填写 Project URL 和 anon / publishable key。不要使用 service_role key。</p><div class="formrow"><input id="url" placeholder="Supabase Project URL"><input id="key" type="password" placeholder="anon / publishable key"></div><div class="formrow"><button class="primary" id="save">保存配置</button><button id="clear">清除配置</button></div><div class="formrow"><input id="email" type="email" placeholder="登录邮箱"><input id="password" type="password" placeholder="密码（至少 6 位）"></div><div class="formrow"><button id="signup">注册</button><button class="primary" id="login">登录</button><button id="logout">退出</button><button id="sync">立即同步</button></div><div id="cloudStatus" class="statusline">尚未连接云端；进度仍保存在本机。</div></section>
<section class="panel"><h2>复现总览</h2><div class="grid"><div class="stat"><strong id="total">7</strong><span>论文</span></div><div class="stat"><strong id="started">0</strong><span>已开始</span></div><div class="stat"><strong id="done">0</strong><span>已完成</span></div><div class="stat"><strong id="avg">0%</strong><span>平均完成度</span></div></div><div class="formrow"><input id="search" placeholder="搜索论文"><select id="filter"><option value="all">全部状态</option><option>未开始</option><option>文献研读</option><option>数据准备</option><option>环境配置</option><option>代码运行</option><option>指标核验</option><option>已完成</option><option>受阻</option></select><button id="export">导出 JSON</button><input id="import" type="file" accept="application/json" style="max-width:180px"></div></section><div id="records"></div><div id="empty" class="panel hidden">没有匹配论文。</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const PAPERS=[{id:"p-amgt",title:"AMGT｜UAV RGB + 红外 + AIS",venue:"arXiv 2610.13220"},{id:"p-feature-ais",title:"特征级融合与 AIS 增强船舶检测跟踪",venue:"中国舰船研究 2026"},{id:"p-vision-radar",title:"Vision–Radar Fusion 海上动态目标检测",venue:"Sensors 2026"},{id:"deepsorvf",title:"DeepSORVF｜AIS + 视频异步轨迹匹配",venue:"IEEE T-ITS 2023"},{id:"naveye",title:"NavEYE｜AIS + 雷达 + RGB",venue:"Ocean Engineering 2026"},{id:"lidarais",title:"LiDAR + AIS｜BEV 船舶检测",venue:"Control Engineering Practice 2026"},{id:"attentionoffsetnet",title:"Attention OffsetNet｜光学-SAR 配准",venue:"IEEE JSTARS 2026"}];
const TASKS=["读懂论文问题与方法","核验数据集与代码","配置运行环境","跑通代码 / 建立基线","复现关键指标","消融或扩展实验"],KEY="maritimeResearchProgressV1",CFG="maritimeSupabaseConfigV1";
const defaults=()=>Object.fromEntries(PAPERS.map(p=>[p.id,{status:"未开始",checks:TASKS.map(()=>false),notes:"",updated:""}]));
let state=load(),client=null,user=null;
function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return defaults()}}function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function conf(){try{return JSON.parse(localStorage.getItem(CFG)||"{}")}catch(e){return {}}}function msg(s){document.getElementById("cloudStatus").textContent=s}
function init(){const c=conf();if(!c.url||!c.key||!window.supabase){client=null;return}client=window.supabase.createClient(c.url,c.key);client.auth.getSession().then(r=>{user=r.data.session?r.data.session.user:null;msg(user?"已登录："+user.email+"；可跨设备同步。":"已连接 Supabase，请登录。")})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function push(id){if(!client||!user)return;const s=state[id],r=await client.from("reproduction_progress").upsert({user_id:user.id,paper_id:id,status:s.status,checks:s.checks,notes:s.notes,updated_at:s.updated},{onConflict:"user_id,paper_id"});if(r.error)msg("本地已保存，云端写入失败："+r.error.message)}
async function sync(){if(!client){msg("请先配置 Supabase 并执行 schema.sql。");return}const u=await client.auth.getUser();user=u.data.user;if(!user){msg("请先登录。");return}msg("正在同步……");const r=await client.from("reproduction_progress").select("*").eq("user_id",user.id);if(r.error){msg("读取失败："+r.error.message);return}(r.data||[]).forEach(x=>{const l=state[x.paper_id];if(!l||Date.parse(x.updated_at||0)>Date.parse(l.updated||0))state[x.paper_id]={status:x.status,checks:x.checks||TASKS.map(()=>false),notes:x.notes||"",updated:x.updated_at||""}});persist();const rows=PAPERS.map(p=>{const s=state[p.id];return {user_id:user.id,paper_id:p.id,status:s.status,checks:s.checks,notes:s.notes,updated_at:s.updated||new Date().toISOString()}});const w=await client.from("reproduction_progress").upsert(rows,{onConflict:"user_id,paper_id"});msg(w.error?"云端写入失败："+w.error.message:"同步完成：7 篇论文进度已同步。");render()}
function stats(){const v=PAPERS.map(p=>state[p.id]);document.getElementById("started").textContent=v.filter(x=>x.status!=="未开始").length;document.getElementById("done").textContent=v.filter(x=>x.status==="已完成").length;document.getElementById("avg").textContent=Math.round(v.reduce((n,x)=>n+x.checks.filter(Boolean).length/TASKS.length,0)/7*100)+"%"}
function render(){const q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;let n=0;const root=document.getElementById("records");root.innerHTML=PAPERS.map(p=>{const s=state[p.id];if(!(p.title+" "+p.venue).toLowerCase().includes(q)||(f!=="all"&&s.status!==f))return "";n++;const pct=Math.round(s.checks.filter(Boolean).length/TASKS.length*100);return '<article class="record" id="'+p.id+'"><div class="meta">'+p.venue+'</div><h3>'+p.title+'</h3><div class="row"><label>阶段 <select class="stage"><option'+(s.status==="未开始"?" selected":"")+'>未开始</option>'+["文献研读","数据准备","环境配置","代码运行","指标核验","已完成","受阻"].map(x=>'<option'+(s.status===x?" selected":"")+'>'+x+'</option>').join("")+'</select></label><b class="pct">'+pct+'%</b><div class="bar"><span style="width:'+pct+'%"></span></div></div><div class="checks">'+TASKS.map((t,i)=>'<label class="check"><input type="checkbox"'+(s.checks[i]?" checked":"")+'>'+t+'</label>').join("")+'</div><textarea class="notes" placeholder="实验参数、问题与结果">'+esc(s.notes)+'</textarea><div class="row"><a href="../papers/detail.html?id='+p.id+'">论文详情 →</a><a href="../papers/pdf.html?id='+p.id+'">PDF →</a></div></article>'}).join("");document.getElementById("empty").classList.toggle("hidden",n>0);stats();root.querySelectorAll(".record").forEach(card=>{const id=card.id;const save=()=>{state[id]={status:card.querySelector(".stage").value,checks:[...card.querySelectorAll('input[type=checkbox]')].map(x=>x.checked),notes:card.querySelector(".notes").value,updated:new Date().toISOString()};persist();const pct=Math.round(state[id].checks.filter(Boolean).length/TASKS.length*100);card.querySelector(".pct").textContent=pct+"%";card.querySelector(".bar span").style.width=pct+"%";if(client&&user)push(id);stats()};card.querySelector(".stage").onchange=save;card.querySelectorAll('input[type=checkbox]').forEach(x=>x.onchange=save);card.querySelector(".notes").onchange=save})}
document.getElementById("save").onclick=()=>{const url=document.getElementById("url").value.trim(),key=document.getElementById("key").value.trim();if(!url.startsWith("https://")||!key){msg("请填写有效 URL 和 anon key。");return}localStorage.setItem(CFG,JSON.stringify({url,key}));init();msg("配置已保存，请注册或登录。")};
document.getElementById("clear").onclick=()=>{localStorage.removeItem(CFG);client=null;user=null;msg("云端配置已清除，本地进度保留。")};
document.getElementById("signup").onclick=async()=>{if(!client){msg("请先配置 Supabase。");return}const r=await client.auth.signUp({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});msg(r.error?"注册失败："+r.error.message:(r.data.session?"注册成功并登录。":"请查收邮箱完成验证。"))};
document.getElementById("login").onclick=async()=>{if(!client){msg("请先配置 Supabase。");return}const r=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(r.error)msg("登录失败："+r.error.message);else{user=r.data.user;await sync()}};
document.getElementById("logout").onclick=async()=>{if(client)await client.auth.signOut();user=null;msg("已退出；本地进度保留。")};document.getElementById("sync").onclick=sync;
document.getElementById("search").oninput=render;document.getElementById("filter").onchange=render;
document.getElementById("export").onclick=()=>{const blob=new Blob([JSON.stringify({records:state},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="maritime-progress-backup.json";a.click();URL.revokeObjectURL(url)};
document.getElementById("import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);state=Object.assign(defaults(),o.records||o);persist();render();msg("导入成功；点击立即同步上传。")}catch(x){msg("JSON 格式错误。")}};r.readAsText(f)};
const c=conf();document.getElementById("url").value=c.url||"";document.getElementById("key").value=c.key||"";init();render();
</script></body></html>

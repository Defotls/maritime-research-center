<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 阅读器｜船舶多模态科研中心</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:"Microsoft YaHei",Arial,sans-serif}header{background:#10213c;color:white;padding:22px max(5%,calc((100% - 1150px)/2))}header h1{margin:0 0 6px;font-size:22px}header p{margin:0;color:#cbd5e1;font-size:13px}nav{background:#fff;padding:12px max(5%,calc((100% - 1150px)/2));display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid #e2e8f0}a{color:#2563eb;text-decoration:none}main{max-width:1150px;margin:20px auto;padding:0 15px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px}h2{font-size:17px;line-height:1.5;margin:0 0 7px}.muted{font-size:13px;color:#64748b;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions a{border:1px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:13px}.primary{background:#2563eb;color:#fff!important}#frameWrap{height:78vh;min-height:500px;background:#dbe2ea;border-radius:9px;overflow:hidden}iframe{width:100%;height:100%;border:0;background:white}.notice{padding:12px;background:#fff7e6;border-left:4px solid #d49a12;border-radius:7px;font-size:13px;line-height:1.8;color:#70500a;margin:12px 0}.hidden{display:none}@media(max-width:650px){#frameWrap{height:68vh;min-height:400px}}
</style></head><body><header><h1>📄 论文 PDF 阅读器</h1><p>从论文库点击 DOI / PDF 后进入本页，优先直接显示公开 PDF。</p></header><nav><a href="index.html">返回论文库</a><a href="../datasets/index.html">数据集数据库</a><a href="../progress/index.html#cloud">云端同步设置</a><a href="../index.html">科研中心首页</a></nav><main>
<section class="card"><h2 id="title">载入论文……</h2><div id="meta" class="muted"></div><div class="actions"><a id="open" class="primary hidden" target="_blank" rel="noopener">新窗口打开 PDF</a><a id="publisher" target="_blank" rel="noopener">出版社 / DOI 页面</a><a id="detail">论文详情</a></div><div id="notice" class="notice"></div></section>
<section class="card"><div id="frameWrap" class="hidden"><iframe id="frame" title="论文 PDF"></iframe></div><div id="noPdf" class="muted hidden">目前没有核实到可公开直连的 PDF。你上传的原始文件仍在个人文件库中；若要在网站跨设备阅读，需要配置云端私有存储后上传有权保存的 PDF。</div></section><section class="card" id="privatePdf"><h2>个人 PDF 私有资料库</h2><p class="muted">没有公开 PDF 的论文，可配置 Supabase 后上传自己有权保存的 PDF。文件只允许登录账号本人访问。</p><div class="actions"><input id="privateFile" type="file" accept="application/pdf"><button id="privateUpload" class="primary">上传并保存个人 PDF</button></div><div id="privateStatus" class="muted">请先在复现进度页配置云端数据库并登录。</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const P={
"p-amgt":{title:"Multi-Modal Graph Neural Network-Inspired Vessel Identification and Tracking for UAV-Based Maritime Surveillance",doi:"10.48550/arXiv.2610.13220",pdf:"https://arxiv.org/pdf/2610.13220",publisher:"https://arxiv.org/abs/2610.13220",note:"arXiv 预印本 PDF，不是正式期刊版本。"},
"p-feature-ais":{title:"Vessel Detection and Tracking Based on Feature-Level Fusion and AIS Enhancement",doi:"10.19693/j.issn.1673-3185.04841",pdf:null,publisher:"https://english.ship-research.com/en/article/cstr/32390.14.j.issn.1673-3185.04841",note:"期刊官网可访问全文，但尚未核实 PDF 直链；打开官方页面，不跳搜索结果。"},
"p-vision-radar":{title:"Dynamic Object Detection in Maritime Navigation Scenarios Based on Vision–Radar Fusion",doi:"10.3390/s26113508",pdf:"https://www.mdpi.com/1424-8220/26/11/3508/pdf",publisher:"https://www.mdpi.com/1424-8220/26/11/3508",note:"Open Access，直接加载 MDPI Version of Record PDF。"},
"deepsorvf":{title:"Asynchronous Trajectory Matching-Based Multimodal Maritime Data Fusion for Vessel Traffic Surveillance in Inland Waterways",doi:"10.1109/TITS.2023.3285415",pdf:"https://arxiv.org/pdf/2302.11283",publisher:"https://doi.org/10.1109/TITS.2023.3285415",note:"当前显示 arXiv 作者预印本 PDF；正式期刊版以 IEEE DOI 页面为准。"},
"naveye":{title:"NavEYE: Vision-Centered Multi-Sensor Fusion-Based Situational Awareness System for Intelligent Surface Vehicles",doi:"10.1016/j.oceaneng.2026.126781",pdf:"https://arxiv.org/pdf/2607.03915",publisher:"https://doi.org/10.1016/j.oceaneng.2026.126781",note:"当前显示 arXiv 作者预印本 PDF；期刊版 ScienceDirect 可能需要机构订阅。"},
"lidarais":{title:"Fusion of LiDAR and AIS Data for Improved Maritime Object Detection",doi:"10.1016/j.conengprac.2026.107100",pdf:"https://papers.ssrn.com/sol3/Delivery.cfm/f1a51e4f-f144-4da3-b477-c93a7cbd0ed6-MECA.pdf?abstractid=5733617&mirid=1",publisher:"https://doi.org/10.1016/j.conengprac.2026.107100",note:"直接显示 SSRN 作者预印本 PDF；与正式期刊版本可能不同。"},
"attentionoffsetnet":{title:"Attention OffsetNet: Translation-Free Transfer Learning for Optical-SAR Registration With Full-Scene Subpixel Refinement",doi:"10.1109/JSTARS.2026.3731425",pdf:null,publisher:"https://doi.org/10.1109/JSTARS.2026.3731425",note:"目前未核实公开 PDF 直链；DOI 进入出版方页面。你上传的 PDF 仍在 ChatGPT 文件库，网站跨设备阅读需配置私有云存储。"}
};
const id=new URLSearchParams(location.search).get("id"),p=P[id];
if(!p){document.getElementById("title").textContent="论文不存在";document.getElementById("noPdf").classList.remove("hidden")}
else{document.title=p.title+"｜PDF 阅读器";document.getElementById("title").textContent=p.title;document.getElementById("meta").textContent="DOI："+p.doi;document.getElementById("notice").textContent=p.note;document.getElementById("publisher").href=p.publisher;document.getElementById("detail").href="detail.html?id="+encodeURIComponent(id);if(p.pdf){document.getElementById("frame").src=p.pdf;document.getElementById("frameWrap").classList.remove("hidden");document.getElementById("open").href=p.pdf;document.getElementById("open").classList.remove("hidden")}else document.getElementById("noPdf").classList.remove("hidden")}
</script>
<script>
(function(){
 const status=document.getElementById("privateStatus"),button=document.getElementById("privateUpload"),fileInput=document.getElementById("privateFile");
 let client=null,user=null;
 try{
  const c=JSON.parse(localStorage.getItem("maritimeSupabaseConfigV1")||"{}");
  if(c.url&&c.key&&window.supabase){
   client=window.supabase.createClient(c.url,c.key);
   client.auth.getSession().then(async r=>{
    user=r.data.session?r.data.session.user:null;
    if(!user){status.textContent="Supabase 已配置，但未登录。请先到复现进度管理页登录。";return}
    status.textContent="已登录："+user.email+"。正在检查个人 PDF……";
    const id=new URLSearchParams(location.search).get("id");
    const q=await client.from("paper_pdf_files").select("storage_path,file_name").eq("paper_id",id).eq("user_id",user.id).maybeSingle();
    if(q.data){
     const signed=await client.storage.from("paper-pdfs").createSignedUrl(q.data.storage_path,3600);
     if(signed.data&&signed.data.signedUrl){
      document.getElementById("frame").src=signed.data.signedUrl;
      document.getElementById("frameWrap").classList.remove("hidden");
      document.getElementById("noPdf").classList.add("hidden");
      document.getElementById("notice").textContent="当前显示个人私有 PDF："+q.data.file_name+"（限时访问链接）。";
      status.textContent="已找到个人 PDF："+q.data.file_name;
     }
    }else status.textContent="已登录云端账号。可以上传本篇论文的个人 PDF。";
   });
  }
 }catch(e){status.textContent="云端初始化失败，请检查配置。"}
 button.addEventListener("click",async()=>{
  const file=fileInput.files[0],id=new URLSearchParams(location.search).get("id");
  if(!client||!user){status.textContent="请先在复现进度页配置 Supabase 并登录。";return}
  if(!file||file.type!=="application/pdf"){status.textContent="请选择 PDF 文件。";return}
  status.textContent="正在上传……";
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=user.id+"/"+id+"/"+Date.now()+"-"+safe;
  const up=await client.storage.from("paper-pdfs").upload(path,file,{contentType:"application/pdf",upsert:true});
  if(up.error){status.textContent="上传失败："+up.error.message;return}
  const saved=await client.from("paper_pdf_files").upsert({user_id:user.id,paper_id:id,storage_path:path,file_name:file.name,updated_at:new Date().toISOString()},{onConflict:"user_id,paper_id"});
  if(saved.error){status.textContent="文件上传成功，但索引保存失败："+saved.error.message;return}
  const signed=await client.storage.from("paper-pdfs").createSignedUrl(path,3600);
  if(signed.data&&signed.data.signedUrl){
   document.getElementById("frame").src=signed.data.signedUrl;
   document.getElementById("frameWrap").classList.remove("hidden");
   document.getElementById("noPdf").classList.add("hidden");
   document.getElementById("notice").textContent="当前显示个人私有 PDF："+file.name+"（限时访问链接）。";
  }
  status.textContent="上传完成。该 PDF 仅此登录账号可访问。";
 });
})();
</script>
</body></html>

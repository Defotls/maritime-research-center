<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="船舶多模态研究数据集数据库，记录传感器模态、规模、下载入口与开放状态。"><title>数据集数据库｜船舶多模态科研中心</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--navy:#10213c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:28px max(5%,calc((100% - 1100px)/2))}header h1{margin:0 0 8px;font-size:24px}header p{margin:0;color:#cbd5e1;line-height:1.8}
nav{background:#fff;padding:14px max(5%,calc((100% - 1100px)/2));display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}nav a,a{color:var(--blue);text-decoration:none}
main{max-width:1100px;margin:26px auto;padding:0 18px}.panel,.dataset{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:13px}.stat strong{display:block;font-size:22px;color:var(--blue)}.stat span{font-size:12px;color:var(--muted)}
input,select{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.tools input{flex:1;min-width:220px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.filters button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 12px;cursor:pointer;color:#334155}.filters button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.dataset h2{font-size:18px;line-height:1.5;margin:8px 0}.meta{font-size:13px;color:var(--muted);line-height:1.8}.dataset p{font-size:14px;line-height:1.8;color:#475569}
.tag{display:inline-block;background:#eaf1ff;color:#2457b5;border-radius:18px;padding:4px 9px;font-size:12px;margin:2px}.state{display:inline-block;background:#eef2f7;color:#475569;border-radius:18px;padding:4px 9px;font-size:12px;margin:2px}.actions{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;margin-top:10px}
.note{background:#fff7e6;border-left:4px solid #d99a00;padding:12px;line-height:1.8;font-size:13px;color:#704d00}.empty{display:none;text-align:center;padding:25px;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:12px}
footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:1fr}.dataset{padding:16px}header h1{font-size:21px}}
</style></head><body>
<header><h1>🗃️ 船舶多模态数据集数据库</h1><p>统一登记数据模态、采集场景、规模、标注内容、开放状态、下载入口与关联论文。</p></header>
<nav><a href="../index.html">科研中心首页</a><a href="../papers/index.html">论文分类库</a><a href="../progress/index.html">复现进度管理</a><a href="#library">数据集库</a></nav>
<main id="library">
<section class="panel"><h2 style="margin-top:0">数据集总览</h2><div class="stats">
<div class="stat"><strong id="total">6</strong><span>数据集记录</span></div><div class="stat"><strong id="public">2</strong><span>有公开下载入口</span></div><div class="stat"><strong id="unknown">4</strong><span>下载状态待核实</span></div></div>
<div class="tools"><input id="search" type="search" placeholder="搜索数据集、传感器、场景或论文……"><select id="availability"><option value="all">全部开放状态</option><option value="public">公开可下载</option><option value="request">按申请获取</option><option value="unknown">下载未核实</option></select></div>
<div class="filters" id="filters"><button class="active" data-filter="all">全部模态</button><button data-filter="AIS">AIS</button><button data-filter="RGB">RGB / 视频</button><button data-filter="IR">红外</button><button data-filter="radar">雷达</button><button data-filter="LiDAR">LiDAR</button><button data-filter="SAR">卫星 SAR</button></div></section>
<div id="datasets"></div><div id="empty" class="empty">没有找到匹配的数据集。</div>
<section class="panel"><h2 style="margin-top:0">数据使用与核验规则</h2><div class="note">“论文使用了某数据集”不等于“数据集可公开下载”。本库将公开下载、联系作者申请、论文描述但未核实下载入口分开记录。下载前应核对许可、版本、数据划分和使用限制；模拟 AIS 与真实 AIS 也必须区分。</div></section>
</main><footer>船舶多模态科研中心 · 数据集数据库</footer>
<script>
const DB=[{"id":"fves","name":"FVessel V1.0 / V2.0","type":"AIS + 可见光视频","status":"public","statusLabel":"V1.0 公开 · V2.0 申请","size":"26 段视频 + AIS；V1.0 含 26 组融合数据、7,625 张检测图像","detail":"长江武汉段桥区和岸边采集；包含 AIS CSV、视频、相机参数、检测/跟踪/融合标注；晴天、阴天和低照度。MMSI 已匿名化。V2.0 增补 9 组融合数据，按项目页面说明联系作者申请。","paper":"DeepSORVF · IEEE T-ITS 2023","paperLink":"../papers/detail.html?id=deepsorvf","dataUrl":"https://github.com/gy65896/FVessel","codeUrl":"https://github.com/gy65896/DeepSORVF","mod":"AIS 视频 轨迹"},{"id":"lidar-marina","name":"Maritime LiDAR–AIS Marina Test Dataset","type":"3D LiDAR + AIS（部分平台同步相机/IMU/GNSS）","status":"public","statusLabel":"公开测试子集","size":"论文总计 3,600 帧、50,000+ 标注、14 类；公开测试子集 600 帧","detail":"密集 marina 场景。论文划分 2,000 train / 600 validation / 600 test，并剔除 400 帧；论文说明训练数据未来提供。AIS 在实验中由 LiDAR 标注模拟，须注意不是全部真实 AIS 广播。","paper":"Fusion of LiDAR and AIS · Control Engineering Practice 2026","paperLink":"../papers/detail.html?id=lidarais","dataUrl":"https://doi.org/10.5281/zenodo.20345163","codeUrl":null,"mod":"LiDAR AIS"},{"id":"mapfusion","name":"MAPFusion","type":"RGB 视频 + AIS + 航海雷达 + GNSS + 陀螺罗经","status":"unknown","statusLabel":"公开下载未核实","size":"135 分钟；8,100 帧；3,402 条 AIS 轨迹；2,206 条雷达轨迹","detail":"分为开阔水域、狭窄航道、港口/锚地三类场景；1,783 张图像带标注，75,781 组 AIS-雷达关联对、5,541 组视觉-AIS-雷达关联对。论文中描述为真实船载同步采集数据。","paper":"NavEYE · Ocean Engineering 2026","paperLink":"../papers/detail.html?id=naveye","dataUrl":null,"codeUrl":null,"mod":"RGB AIS radar"},{"id":"kompsat-sar","name":"KOMPSAT-3A / TerraSAR-X Optical–SAR Registration Set","type":"卫星光学 RGB + 卫星 SAR（X 波段）","status":"unknown","statusLabel":"公开下载未核实","size":"11 景 KOMPSAT-3A + 2 景 TerraSAR-X；7,825 组光学-SAR 训练对、3,509 组测试对","detail":"论文还构建了 9,664 组光学-光学预训练对和 3,600 组测试对。该数据面向卫星图像配准，不是船载雷达数据集。","paper":"Attention OffsetNet · IEEE JSTARS 2026","paperLink":"../papers/detail.html?id=attentionoffsetnet","dataUrl":null,"codeUrl":null,"mod":"RGB SAR crossdomain"},{"id":"map-m2uav50","name":"MAP-M2UAV50","type":"无人机 RGB + 红外 + AIS + 飞行状态","status":"unknown","statusLabel":"公开下载未核实","size":"论文页面报告约 12,000 张图像、50 段视频、约 70,000 条标注","detail":"对应论文分类库中的 UAV 多模态船舶识别与跟踪预印本。当前网站保留论文报告的数据规模；代码和数据的可访问公开下载入口尚未核实。","paper":"AMGT · UAV 多模态船舶识别与跟踪","paperLink":"../index.html#p-amgt","dataUrl":null,"codeUrl":null,"mod":"RGB IR AIS"},{"id":"mvrd","name":"MVRD","type":"毫米波雷达 + 可见光","status":"unknown","statusLabel":"公开下载未核实","size":"3,848 张图像 + 3,848 帧雷达数据；28,332 个目标标注","detail":"对应视觉-雷达动态海上目标检测研究的作者自建数据集。当前未确认可直接下载的公开数据入口；不要与 WaterScenes 等其他数据集混为一谈。","paper":"Dynamic Object Detection in Maritime Navigation Scenarios Based on Vision–Radar Fusion","paperLink":"../index.html#p-vision-radar","dataUrl":null,"codeUrl":null,"mod":"RGB radar"}];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let filter="all";
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),av=document.getElementById("availability").value;let shown=0;
document.getElementById("datasets").innerHTML=DB.filter(d=>(filter==="all"||d.mod.includes(filter))&&(av==="all"||d.status===av)&&(d.name+" "+d.type+" "+d.size+" "+d.detail+" "+d.paper).toLowerCase().includes(q)).map(d=>{shown++;return '<article class="dataset" id="'+esc(d.id)+'"><span class="state">'+esc(d.statusLabel)+'</span><span class="tag">'+esc(d.type)+'</span><h2>'+esc(d.name)+'</h2><div class="meta">规模：'+esc(d.size)+'<br>关联论文：'+esc(d.paper)+'</div><p>'+esc(d.detail)+'</p><div class="actions">'+(d.dataUrl?'<a href="'+esc(d.dataUrl)+'" target="_blank" rel="noopener">数据下载 / 项目页 ↗</a>':'<span class="meta">暂无已核实下载链接</span>')+(d.codeUrl?'<a href="'+esc(d.codeUrl)+'" target="_blank" rel="noopener">关联代码 ↗</a>':'')+'<a href="'+esc(d.paperLink)+'">查看关联论文 →</a></div></article>'}).join("");
document.getElementById("empty").style.display=shown?"none":"block";
}
document.querySelectorAll("#filters button").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("active",x===b));render()}));
document.getElementById("search").addEventListener("input",render);document.getElementById("availability").addEventListener("change",render);render();
</script></body></html>
